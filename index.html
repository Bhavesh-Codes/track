                                            <h5 className="small-label font-medium text-[var(--text-primary)] mb-2">30-day productivity trend</h5>
                                            <div className="flex-1 min-h-[160px]">
                                                <TrendChart logs={logs} theme={theme} />
                                            </div>
                                        </div>
                                        <div className="w-full lg:w-64 shrink-0 grid grid-cols-2 lg:grid-cols-1 lg:grid-rows-2 gap-3 lg:gap-4">
                                            <div className="bg-[var(--bg-secondary)] p-4 rounded-xl border border-[var(--border)]">
                                                <div className={`hero-number ${allTimeBest ? 'text-[var(--productive)]' : 'text-[var(--text-tertiary)]'}`}>
                                                    {allTimeBest ? `${allTimeBest.score}%` : '—'}
                                                </div>
                                                <div className="small-label mt-1">All-time best</div>
                                                <div className="micro-label mt-0.5">
                                                    {allTimeBest ? `${allTimeBest.logged}h logged · ${shortDate(allTimeBest.date)}` : 'Log a day to start'}
                                                </div>
                                            </div>
                                            <div className="bg-[var(--bg-secondary)] p-4 rounded-xl border border-[var(--border)]">
                                                <div className={`hero-number ${vsLastWeek.available ? vsLastWeek.trend === 'up' ? 'text-[var(--productive)]' : vsLastWeek.trend === 'down' ? 'text-[var(--wasted)]' : 'text-[var(--text-primary)]' : 'text-[var(--text-tertiary)]'}`}>
                                                    {vsLastWeek.available ? `${vsLastWeek.trend === 'up' ? '↑ ' : vsLastWeek.trend === 'down' ? '↓ ' : ''}${vsLastWeek.val}%` : '—'}
                                                </div>
                                                <div className="small-label mt-1">vs Last Week</div>
                                                <div className="micro-label mt-0.5">
                                                    {vsLastWeek.available ? 'Average of logged days' : 'Not enough history yet'}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {(activeTab === 'categories' || activeTab === 'daily view') && (
                                    coveredHours === 0 ? (
                                        <div className="h-full flex flex-col items-center justify-center text-center gap-1 py-8">
                                            <div className="body-text text-[var(--text-secondary)]">
                                                No hours logged {activeTab === 'categories' ? 'in the last 7 days' : 'for this date'}.
                                            </div>
                                            <div className="micro-label">Log an hour to see the breakdown.</div>
                                        </div>
                                    ) : (
                                        <div className="h-full flex flex-col md:flex-row gap-4 lg:gap-6">
                                            <div className="relative w-full md:w-1/3 min-h-[190px] shrink-0">
                                                <DonutChart 
                                                    data={currentData} 
                                                    totalCapacity={totalCapacity}
                                                    theme={theme}
                                                />
                                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                    <div className="text-center">
                                                        <div className="font-mono mono-nums text-[28px] font-bold leading-none text-[var(--text-primary)]">
                                                            {coveredHours}/{totalCapacity}
                                                        </div>
                                                        <div className="small-label mt-1">hours logged</div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="flex-1 min-w-0 lg:overflow-y-auto lg:pr-2">
                                                <h5 className="subsection mb-4">
                                                    {activeTab === 'categories' ? 'Weekly Breakdown' : `Breakdown for ${viewDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}`}
                                                </h5>
                                                <div className="space-y-4">
                                                    {Object.entries(currentData)
                                                        .filter(([, val]) => val > 0)
                                                        .sort((a,b) => b[1] - a[1])
                                                        .map(([k, val]) => {
                                                            const percentage = Math.round((val / totalCapacity) * 100);
                                                            const catItem = CATEGORIES[k] || CATEGORIES.unlogged;
                                                            const ListIcon = catItem.icon;

                                                            return (
                                                                <div key={k} className="flex items-center gap-4">
                                                                    <div className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style={{backgroundColor: catItem.color, color: catItem.ink}}>
                                                                        <ListIcon size={16} aria-hidden="true" />
                                                                    </div>
                                                                    <div className="flex-1 min-w-0">
                                                                        <div className="flex justify-between gap-3 body-text mb-1">
                                                                            <span className="font-medium">{catItem.label}</span>
                                                                            <span className="font-mono mono-nums text-[var(--text-secondary)] shrink-0">
                                                                                {val}h <span className="text-sm">· {percentage}%</span>
                                                                            </span>
                                                                        </div>
                                                                        <div className="h-2 bg-[var(--bg-tertiary)] rounded-full overflow-hidden">
                                                                            <div className="h-2 rounded-full" style={{width: `${percentage}%`, backgroundColor: catItem.color}}></div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                </div>
                                            </div>
                                        </div>
                                    )
                                )}
                            </div>
                        )}
                    </aside>

                    {/* Modals */}
                    {modals.log && selectedLogHour && (
                        <Modal
                            labelledBy="log-modal-title"
                            onClose={() => {
                                stopAlarm();
                                setModals(prev => ({ ...prev, log: false }));
                            }}
                            onKeyDown={(e) => {
                                const tag = e.target.tagName;
                                if (tag === 'TEXTAREA' || tag === 'INPUT') return;
                                const index = ['1','2','3','4','5','6','7','8'].indexOf(e.key);
                                if (index >= 0 && loggableCategories[index]) {
                                    e.preventDefault();
                                    setLogCategory(loggableCategories[index][0]);
                                }
                            }}
                        >
                            <div className="flex justify-between items-start gap-4 mb-5">
                                <div>
                                    <h3 id="log-modal-title" className="section-heading">Log Activity</h3>
                                    <p className="small-label mt-1">
                                        {selectedLogHour.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} · {hourRangeLabel(selectedLogHour.hour)}
                                    </p>
                                </div>
                                {selectedExistingLog && (
                                    <button
                                        type="button"
                                        onClick={deleteLog}
                                        aria-label="Delete this hour's log"
                                        className="btn-quiet p-2 rounded-lg text-[var(--wasted)]"
                                    >
                                        <Trash size={18} aria-hidden="true" />
                                    </button>
                                )}
                            </div>
                            <textarea 
                                data-autofocus
                                aria-label="Note for this hour"
                                className="w-full bg-[var(--bg-primary)] border border-[var(--border)] rounded-xl p-4 mb-6 outline-none focus:ring-2 focus:ring-[var(--accent)] focus:border-transparent resize-none placeholder:text-[var(--text-tertiary)]"
                                rows="3"
                                placeholder="What were you doing? (optional)"
                                value={logText}
                                onChange={e => setLogText(e.target.value)}
                            />
                            <div className="grid grid-cols-4 gap-2 mb-3" role="group" aria-label="Category">
                                {loggableCategories.map(([key, cat], index) => {
                                    const BtnIcon = cat.icon;
                                    const selected = logCategory === key;
                                    return (
                                        <button 
                                            type="button"
                                            key={key}
                                            onClick={() => setLogCategory(key)}
                                            aria-pressed={selected}
                                            title={`${cat.label} (${index + 1})`}
                                            className={`relative min-h-[74px] px-2 py-3 rounded-lg text-[13px] font-medium transition-colors flex flex-col items-center justify-center gap-2 ${selected ? 'shadow-lg' : 'bg-[var(--bg-primary)] text-[var(--text-secondary)] hover:bg-[var(--bg-tertiary)] hover:text-[var(--text-primary)]'}`}
                                            style={selected ? { backgroundColor: cat.color, color: cat.ink } : undefined}
                                        >
                                            <BtnIcon size={20} aria-hidden="true" />
                                            <span className="leading-tight text-center">{cat.label}</span>
                                            <span className="absolute top-1.5 right-2 text-[10px] font-mono opacity-60" aria-hidden="true">{index + 1}</span>
                                        </button>
                                    );
                                })}
                            </div>
                            <p className="micro-label mb-5">Keys 1–8 choose a category · Esc closes</p>
                            <div className="flex gap-3">
                                <button 
                                    type="button"
                                    onClick={handleLogSave} 
                                    disabled={!logCategory}
                                    className="flex-1 py-3 px-4 rounded-lg font-medium transition-colors disabled:bg-[var(--bg-tertiary)] disabled:text-[var(--text-tertiary)]"
                                    style={logCategory ? { backgroundColor: CATEGORIES[logCategory].color, color: CATEGORIES[logCategory].ink } : undefined}
                                >
                                    Save Log
                                </button>
                                <button
                                    type="button"
                                    onClick={() => { stopAlarm(); setModals(prev => ({ ...prev, log: false })); }}
                                    className="btn-quiet px-6 py-3 text-sm font-medium rounded-xl"
                                >
                                    Cancel
                                </button>
                            </div>
                        </Modal>
                    )}
                    
                    {modals.sleep && (
                        <Modal
                            labelledBy="sleep-modal-title"
                            onClose={() => { setModals(prev => ({ ...prev, sleep: false })); setSleepSelection([]); }}
                        >
                            <h3 id="sleep-modal-title" className="section-heading mb-1">Log Sleep</h3>
                            <p className="body-text text-[var(--text-secondary)] mb-5">
                                Select the hours you slept on {viewDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}.
                            </p>
                            <div className="grid grid-cols-6 gap-2 mb-4">
                                {Array.from({length: 24}).map((_, h) => {
                                    const isSelected = sleepSelection.includes(h);
                                    return (
                                        <button
                                            type="button"
                                            key={h}
                                            onClick={() => toggleSleepHour(h)}
                                            aria-pressed={isSelected}
                                            aria-label={hourRangeLabel(h)}
                                            className={`py-3 rounded-lg text-sm font-medium transition-colors ${isSelected ? '' : 'bg-[var(--bg-primary)] text-[var(--text-secondary)] hover:bg-[var(--bg-tertiary)] hover:text-[var(--text-primary)]'}`}
                                            style={isSelected ? { backgroundColor: CATEGORIES.sleep.color, color: CATEGORIES.sleep.ink } : undefined}
                                        >
                                            {hourShortLabel(h)}
                                        </button>
                                    );
                                })}
                            </div>
                            <p className="micro-label mb-5">
                                {sleepSelection.length === 0
                                    ? 'Select at least one hour.'
                                    : `${sleepSelection.length} ${sleepSelection.length === 1 ? 'hour' : 'hours'} selected${sleepConflicts > 0 ? ` · ${sleepConflicts} already logged ${sleepConflicts === 1 ? 'hour stays' : 'hours stay'} unchanged` : ''}`}
                            </p>
                            <div className="flex gap-3">
                                <button type="button" onClick={saveSleep} disabled={sleepSelection.length === 0} className="btn-primary flex-1 py-3 text-sm font-medium">Save Sleep</button>
                                <button
                                    type="button"
                                    onClick={() => { setModals(prev => ({ ...prev, sleep: false })); setSleepSelection([]); }}
                                    className="btn-quiet px-6 py-3 text-sm font-medium rounded-xl"
                                >
                                    Cancel
                                </button>
                            </div>
                        </Modal>
                    )}

                    {modals.goals && (
                        <Modal
                            labelledBy="goals-modal-title"
                            maxWidth="max-w-sm"
                            onClose={() => setModals(prev => ({ ...prev, goals: false }))}
                        >
                            <h3 id="goals-modal-title" className="section-heading mb-6 flex items-center gap-2">
                                <Target className="text-[var(--accent)]" size={20} aria-hidden="true" /> Set Daily Goals
                            </h3>
                            <div className="space-y-4 mb-6">
                                <div>
                                    <label htmlFor="goal-productive" className="small-label font-medium text-[var(--text-primary)] mb-2 block">Productive hours</label>
                                    <input 
                                        id="goal-productive"
                                        type="number" min="1" max="24" inputMode="numeric"
                                        value={tempGoals.productive}
                                        onChange={(e) => setTempGoals({...tempGoals, productive: parseInt(e.target.value) || 0})}
                                        className="w-full bg-[var(--bg-primary)] border border-[var(--border)] rounded-xl p-3 outline-none focus:ring-2 focus:ring-[var(--accent)] focus:border-transparent font-mono mono-nums font-bold text-[var(--text-primary)]"
                                    />
                                </div>
                                <div>
                                    <label htmlFor="goal-sleep" className="small-label font-medium text-[var(--text-primary)] mb-2 block">Sleep hours</label>
                                    <input 
                                        id="goal-sleep"
                                        type="number" min="1" max="24" inputMode="numeric"
                                        value={tempGoals.sleep}
                                        onChange={(e) => setTempGoals({...tempGoals, sleep: parseInt(e.target.value) || 0})}
                                        className="w-full bg-[var(--bg-primary)] border border-[var(--border)] rounded-xl p-3 outline-none focus:ring-2 focus:ring-[var(--accent)] focus:border-transparent font-mono mono-nums font-bold text-[var(--text-primary)]"
                                    />
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <button type="button" onClick={saveGoals} className="btn-primary flex-1 py-3 text-sm font-medium">Update Goals</button>
                                <button
                                    type="button"
                                    onClick={() => setModals(prev => ({ ...prev, goals: false }))}
                                    className="btn-quiet px-6 py-3 text-sm font-medium rounded-xl"
                                >
                                    Cancel
                                </button>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        }

        // Mount directly without event wrapper (the DOM node is already declared above)
        const rootNode = document.getElementById('root');
        if (rootNode) {
            const root = ReactDOM.createRoot(rootNode);
            root.render(<App />);
        }
    </script>
</body>
</html>
