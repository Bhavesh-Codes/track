<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARM - Time Tracking</title>

    <script>
        // Apply the saved theme before first paint so dark/light never flashes.
        try {
            const savedTheme = localStorage.getItem('karm_theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (e) {}
    </script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js UMD -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

    <style>
        /* CSS Variables - Dark Minimalist Theme */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #181818;
            --bg-tertiary: #262626;
            --bg-hover: #303030;
            --text-primary: #f5f5f5;
            --text-secondary: #a3a3a3;
            --text-tertiary: #8a8a8a;
            --accent: #0a6cd6;
            --accent-hover: #0d7be8;
            --border: #272727;
            --border-strong: #3a3a3a;
            --hover-ring: rgba(255, 255, 255, 0.28);
            --overlay: rgba(0, 0, 0, 0.72);
            --shadow-color: rgba(0, 0, 0, 0.5);
            
            /* Category Colors */
            --productive: #15803d;       /* Dark Green */
            --semi-productive: #bef264;  /* Semi Productive */
            --neutral: #64748b;          /* Neutral (Slate) */
            --gym: #ec4899;              /* Gym (Pink) */
            --errands: #eab308;          /* Errands (Yellow) */
            --unproductive: #f97316;     /* Unproductive */
            --wasted: #ef4444;           /* Wasted */
            --sleep: #6366f1;            /* Sleep */
            --unlogged: #374151;         /* Unlogged */
        }

        /* Light Theme */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg-primary: #f6f6f7;
            --bg-secondary: #ffffff;
            --bg-tertiary: #ececef;
            --bg-hover: #e2e2e7;
            --text-primary: #17171a;
            --text-secondary: #55555f;
            --text-tertiary: #6f6f7a;
            --accent: #0a6cd6;
            --accent-hover: #085cba;
            --border: #e3e3e8;
            --border-strong: #c8c8d1;
            --hover-ring: rgba(0, 0, 0, 0.24);
            --overlay: rgba(20, 20, 28, 0.38);
            --shadow-color: rgba(20, 20, 30, 0.18);
        }


        /* Base Styles */
        html { color-scheme: dark; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: -0.011em;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(10, 108, 214, 0.45); color: var(--text-primary); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
        button { cursor: pointer; }
        button:disabled { cursor: not-allowed; }
        input, textarea { caret-color: var(--accent); }

        /* Typography */
        .hero-number { 
            font-size: 44px; 
            font-weight: 700; 
            line-height: 1; 
            font-family: "SF Mono", "Monaco", "Consolas", monospace;
            font-variant-numeric: tabular-nums;
        }
        .section-heading { 
            font-size: 24px; 
            font-weight: 600; 
            line-height: 1.25; 
            letter-spacing: -0.02em;
        }
        .subsection { 
            font-size: 17px; 
            font-weight: 500; 
            line-height: 1.35; 
        }
        .body-text { 
            font-size: 16px; 
            font-weight: 400; 
            line-height: 1.5; 
        }
        .small-label { 
            font-size: 14px; 
            font-weight: 400; 
            line-height: 1.4;
            color: var(--text-secondary);
        }
        .micro-label {
            font-size: 12px;
            font-weight: 500;
            line-height: 1.45;
            letter-spacing: 0.01em;
            color: var(--text-tertiary);
        }
        .mono-nums { font-variant-numeric: tabular-nums; }

        /* Cards */
        .widget-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        /* Sidebar density: three cards must clear the analytics bar on short laptop viewports. */
        #app-sidebar { padding: 10px; gap: 10px; }
        #app-sidebar .widget-card { padding: 14px; }

        @media (max-height: 880px) {
            #app-sidebar { padding: 8px; gap: 8px; }
            #app-sidebar .widget-card { padding: 12px; }
            #app-sidebar .timer-hint { display: none; }
            #app-sidebar .timer-readout { font-size: 28px; }
            #app-sidebar .timer-block { margin-bottom: 10px; }
            #app-sidebar .goals-list > * + * { margin-top: 12px; }
        }

        @media (max-height: 800px) {
            #app-sidebar .widget-card { padding: 11px; }
            #app-sidebar .calendar-legend { display: none; }
            #app-sidebar .calendar-grid > * { aspect-ratio: auto; height: 30px; }
            #app-sidebar .timer-readout { font-size: 26px; }
            #app-sidebar .timer-button { padding-top: 8px; padding-bottom: 8px; }
        }

        @media (max-height: 720px) {
            #app-sidebar .calendar-grid > * { height: 25px; }
            #app-sidebar .timer-readout { font-size: 24px; }
        }

        /* Timeline Block */
        .timeline-block {
            transition: background-color 160ms ease-out, border-color 160ms ease-out, filter 160ms ease-out;
        }
        .timeline-block:hover {
            filter: brightness(1.06);
            border-color: var(--border-strong);
        }
        .timeline-block:active {
            filter: brightness(0.98);
        }
        .timeline-block[data-logged="true"]:hover {
            border-color: var(--hover-ring);
        }

        /* Buttons */
        .btn-primary {
            background: var(--accent);
            color: white;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 500;
            transition: background-color 160ms ease-out;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { background: var(--bg-tertiary); color: var(--text-tertiary); }
        .btn-quiet {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border-radius: 10px;
            transition: background-color 160ms ease-out, color 160ms ease-out;
        }
        .btn-quiet:hover { background: var(--bg-hover); color: var(--text-primary); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 8px; border: 2px solid var(--bg-primary); }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

        /* Animations */
        .modal-fade-in {
            animation: modalFadeIn 180ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(8px) scale(0.985); }
            to { opacity: 1; transform: none; }
        }
        
        .toast-slide-up {
            animation: toastSlideUp 260ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes toastSlideUp {
            from { opacity: 0; transform: translate(-50%, -12px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Configure Babel to force classic React JSX transform without ES module imports -->
    <script>
        if (window.Babel) {
            Babel.registerPreset('react-classic', {
                presets: [
                    [Babel.availablePresets['react'], { runtime: 'classic' }]
                ]
            });
        }
    </script>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;

        // --- Minimalist SVG Icons ---
        const Icon = ({ children, className = '', ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`w-5 h-5 ${className}`} {...props}>{children}</svg>
        );
        const Clock = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
        const Plus = (props) => <Icon {...props}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
        const Moon = (props) => <Icon {...props}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></Icon>;
        const TrendingUp = (props) => <Icon {...props}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Icon>;
        const ChevronDown = (props) => <Icon {...props}><polyline points="6 9 12 15 18 9"/></Icon>;
        const ChevronUp = (props) => <Icon {...props}><polyline points="18 15 12 9 6 15"/></Icon>;
        const ChevronLeft = (props) => <Icon {...props}><polyline points="15 18 9 12 15 6"/></Icon>;
        const ChevronRight = (props) => <Icon {...props}><polyline points="9 18 15 12 9 6"/></Icon>;
        const Target = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>;
        const Trash = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Icon>;
        const Copy = (props) => <Icon {...props}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Icon>;
        const Volume2 = (props) => <Icon {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></Icon>;
        const VolumeX = (props) => <Icon {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></Icon>;
        const Sun = (props) => <Icon {...props}><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></Icon>;
        const Zap = (props) => <Icon {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Icon>;
        const BarChart = (props) => <Icon {...props}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></Icon>;
        
        // Category Icons
        const Briefcase = (props) => <Icon {...props}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></Icon>;
        const Activity = (props) => <Icon {...props}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Icon>;
        const Coffee = (props) => <Icon {...props}><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></Icon>;
        const ShoppingCart = (props) => <Icon {...props}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></Icon>;
        const Smartphone = (props) => <Icon {...props}><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></Icon>;
        const XCircle = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></Icon>;
        const HelpCircle = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>;

        // --- Categories Config ---
        // Ink is chosen per fill so text always clears 4.5:1 against its own color.
        const readableInk = (hex) => {
            const raw = hex.replace('#', '');
            const n = parseInt(raw.length === 3 ? raw.split('').map(c => c + c).join('') : raw, 16);
            const channel = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
            const L = 0.2126 * channel(n >> 16) + 0.7152 * channel((n >> 8) & 255) + 0.0722 * channel(n & 255);
            return L > 0.18 ? '#0a0a0a' : '#ffffff';
        };

        const CATEGORIES = {
            productive: { label: 'Productive', color: '#15803d', icon: Briefcase },
            semiProductive: { label: 'Semi Productive', color: '#bef264', icon: Activity }, 
            neutral: { label: 'Neutral', color: '#64748b', icon: Coffee }, 
            gym: { label: 'Gym', color: '#ec4899', icon: Zap }, 
            errands: { label: 'Errands', color: '#eab308', icon: ShoppingCart },
            unproductive: { label: 'Unproductive', color: '#f97316', icon: Smartphone },
            wasted: { label: 'Wasted', color: '#ef4444', icon: XCircle },
            sleep: { label: 'Sleep', color: '#6366f1', icon: Moon },
            unlogged: { label: 'Unlogged', color: '#374151', icon: HelpCircle }
        };
        Object.values(CATEGORIES).forEach(cat => { cat.ink = readableInk(cat.color); });

        const SCORE_BANDS = [
            { min: 0, label: '0–20', color: '#ef4444' },
            { min: 21, label: '21–40', color: '#f97316' },
            { min: 41, label: '41–60', color: '#64748b' },
            { min: 61, label: '61–80', color: '#bef264' },
            { min: 81, label: '81–100', color: '#15803d' }
        ];

        const scoreBand = (score) => {
            for (let i = SCORE_BANDS.length - 1; i >= 0; i--) {
                if (score > SCORE_BANDS[i].min) return SCORE_BANDS[i];
            }
            return SCORE_BANDS[0];
        };

        // Chart.js cannot read CSS variables, so its palette is mirrored per theme.
        const CHART_THEMES = {
            dark: {
                tooltipBg: 'rgba(24, 24, 24, 0.97)', tooltipTitle: '#f5f5f5', tooltipBody: '#d4d4d4',
                tooltipBorder: '#272727', tick: '#a3a3a3', grid: '#242424', axis: '#272727',
                pointBorder: '#0a0a0a', line: '#0a6cd6'
            },
            light: {
                tooltipBg: 'rgba(255, 255, 255, 0.98)', tooltipTitle: '#17171a', tooltipBody: '#45454f',
                tooltipBorder: '#e3e3e8', tick: '#55555f', grid: '#e8e8ec', axis: '#d4d4da',
                pointBorder: '#ffffff', line: '#0a6cd6'
            }
        };
        const chartTheme = (theme) => CHART_THEMES[theme] || CHART_THEMES.dark;

        // --- Helpers ---
        const getDateKey = (date) => {
            const d = new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getDayStats = (date, logs) => {
            const dateKey = getDateKey(date);
            const stats = { productive: 0, semiProductive: 0, neutral: 0, gym: 0, errands: 0, unproductive: 0, wasted: 0, sleep: 0, unlogged: 0 };
            for (let hour = 0; hour < 24; hour++) {
                const key = `${dateKey}_${hour}`;
                const log = logs[key];
                if (log && stats[log.category] !== undefined) stats[log.category]++;
                else stats.unlogged++;
            }
            return stats;
        };

        const getProductivityScore = (stats) => {
            const totalLogged = 24 - stats.unlogged - stats.sleep;
            if (totalLogged <= 0) return 0;
            const scorePoints = stats.productive + stats.gym + (stats.semiProductive * 0.5) + (stats.neutral * 0.5);
            return Math.round((scorePoints / totalLogged) * 100);
        };

        const calculateStreak = (logs) => {
            let streak = 0;
            const today = new Date();
            for (let i = 0; i < 365; i++) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const stats = getDayStats(d, logs);
                if (stats.unlogged < 20) streak++;
                else if (i > 0) break;
            }
            return streak;
        };

        // --- Components ---
        const DigitalClock = () => {
            const [time, setTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 10000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div
                    aria-hidden="true"
                    className="hidden lg:block font-mono mono-nums text-[30px] lg:text-[34px] font-semibold tracking-tight leading-none text-[var(--text-primary)]"
                >
                    {time.toLocaleTimeString([], { hour12: true, hour: '2-digit', minute: '2-digit' }).toUpperCase()}
                </div>
            );
        };

        const MiniCalendar = ({ logs, selectedDate, month, onSelectDate, onPrevMonth, onNextMonth }) => {
            const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
            const firstDay = new Date(month.getFullYear(), month.getMonth(), 1).getDay();
            const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
            const emptyDays = Array.from({ length: firstDay }, (_, i) => i);

            return (
                <div className="widget-card">
                    <div className="flex justify-between items-center mb-4">
                        <button type="button" onClick={onPrevMonth} aria-label="Previous month" className="btn-quiet p-2 rounded-lg text-[var(--text-secondary)]">
                            <ChevronLeft size={16} />
                        </button>
                        <h3 className="text-base font-semibold leading-none">{month.toLocaleString('default', { month: 'long', year: 'numeric' })}</h3>
                        <button type="button" onClick={onNextMonth} aria-label="Next month" className="btn-quiet p-2 rounded-lg text-[var(--text-secondary)]">
                            <ChevronRight size={16} />
                        </button>
                    </div>
                    
                    <div className="calendar-grid grid grid-cols-7 gap-1 text-center">
                        {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => <span key={d} className="text-[11px] font-semibold uppercase tracking-wider text-[var(--text-tertiary)] py-1">{d}</span>)}
                        {emptyDays.map(d => <div key={`empty-${d}`} />)}
                        {days.map(day => {
                            const date = new Date(month.getFullYear(), month.getMonth(), day);
                            const stats = getDayStats(date, logs);
                            const active = 24 - stats.unlogged - stats.sleep;
                            const hasLogs = stats.unlogged < 24;
                            const score = active > 0 ? getProductivityScore(stats) : null;
                            const band = score !== null ? scoreBand(score) : null;
                            const isSelected = getDateKey(date) === getDateKey(selectedDate);

                            return (
                                <button
                                    type="button"
                                    key={day}
                                    onClick={() => onSelectDate(date)}
                                    aria-label={`${date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}${score !== null ? `, score ${score} percent` : hasLogs ? ', no active hours logged' : ', no hours logged'}`}
                                    aria-current={isSelected ? 'date' : undefined}
                                    title={score !== null ? `${score}% score · ${24 - stats.unlogged}h logged` : hasLogs ? `${24 - stats.unlogged}h logged · no active hours` : 'No hours logged'}
                                    className={`aspect-square rounded-md flex items-center justify-center text-[13px] font-medium transition-colors
                                        ${hasLogs ? '' : 'text-[var(--text-tertiary)] hover:bg-[var(--bg-tertiary)] hover:text-[var(--text-primary)]'}
                                        ${isSelected ? 'ring-2 ring-[var(--text-primary)] ring-offset-2 ring-offset-[var(--bg-secondary)]' : ''}
                                        ${!hasLogs ? '' : score === null ? 'bg-[var(--bg-tertiary)] text-[var(--text-secondary)]' : 'hover:brightness-110'}
                                    `}
                                    style={band ? { backgroundColor: band.color, color: readableInk(band.color) } : undefined}
                                >
                                    {day}
                                </button>
                            );
                        })}
                    </div>

                    <div className="calendar-legend mt-4 pt-3 border-t border-[var(--border)] flex items-center justify-between gap-2">
                        <span className="micro-label">Score</span>
                        <div className="flex items-center gap-1.5" aria-hidden="true">
                            <span className="micro-label">0</span>
                            {SCORE_BANDS.map(band => (
                                <span key={band.label} title={band.label} className="h-2.5 w-2.5 rounded-sm" style={{ backgroundColor: band.color }} />
                            ))}
                            <span className="micro-label">100</span>
                        </div>
                    </div>
                </div>
            );
        };

        const DonutChart = memo(({ data, totalCapacity, theme }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                if (!chartRef.current) return;
                const ctx = chartRef.current.getContext('2d');
                const c = chartTheme(theme);
                
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.values(CATEGORIES).map(c => c.label),
                        datasets: [{
                            data: Object.keys(CATEGORIES).map(k => data[k] || 0),
                            backgroundColor: Object.values(CATEGORIES).map(c => c.color),
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { 
                            legend: { display: false },
                            tooltip: {
                                enabled: true,
                                backgroundColor: c.tooltipBg,
                                titleColor: c.tooltipTitle,
                                bodyColor: c.tooltipBody,
                                borderColor: c.tooltipBorder,
                                borderWidth: 1,
                                padding: 12,
                                cornerRadius: 8,
                                displayColors: true,
                                titleFont: { size: 14, weight: 'bold', family: '-apple-system, BlinkMacSystemFont, "Segoe UI"' },
                                bodyFont: { size: 13, family: 'SF Mono, Monaco, Consolas, monospace' },
                                callbacks: {
                                    label: function(context) {
                                        const value = context.raw || 0;
                                        const percentage = totalCapacity > 0 ? Math.round((value / totalCapacity) * 100) : 0;
                                        return `${value}h · ${percentage}%`;
                                    }
                                }
                            }
                        },
                        cutout: '70%',
                        animation: { duration: 260 }
                    }
                });
                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [data, totalCapacity, theme]);

            return <canvas ref={chartRef} className="w-full h-full" />;
        });

        const TrendChart = memo(({ logs, theme }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const days = useMemo(() => {
                return Array.from({ length: 30 }, (_, i) => {
                    const d = new Date();
                    d.setDate(d.getDate() - (29 - i));
                    const stats = getDayStats(d, logs);
                    const active = 24 - stats.unlogged - stats.sleep;
                    return {
                        date: d,
                        label: d.getDate(),
                        score: active > 0 ? getProductivityScore(stats) : null,
                        logged: 24 - stats.unlogged
                    };
                });
            }, [logs]);

            const hasData = days.some(d => d.score !== null);

            useEffect(() => {
                if (!chartRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                const c = chartTheme(theme);
                
                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: days.map(d => d.label),
                        datasets: [{
                            label: 'Score',
                            data: days.map(d => d.score),
                            borderColor: c.line,
                            backgroundColor: 'transparent',
                            fill: false,
                            tension: 0.35,
                            borderWidth: 2,
                            spanGaps: false,
                            pointRadius: 3,
                            pointHoverRadius: 5,
                            pointBackgroundColor: c.line,
                            pointBorderColor: c.pointBorder,
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            y: { 
                                min: 0, max: 100, 
                                ticks: { color: c.tick, font: { size: 11 }, callback: (v) => `${v}%` },
                                grid: { color: c.grid },
                                border: { display: false }
                            },
                            x: { 
                                ticks: { color: c.tick, font: { size: 11 }, maxTicksLimit: 10, autoSkip: true },
                                grid: { display: false },
                                border: { color: c.axis }
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: c.tooltipBg,
                                titleColor: c.tooltipTitle,
                                bodyColor: c.tooltipBody,
                                borderColor: c.tooltipBorder,
                                borderWidth: 1,
                                padding: 12,
                                cornerRadius: 8,
                                titleFont: { size: 13, weight: 'bold', family: '-apple-system, BlinkMacSystemFont, "Segoe UI"' },
                                bodyFont: { size: 12, family: 'SF Mono, Monaco, Consolas, monospace' },
                                callbacks: {
                                    title: (items) => days[items[0].dataIndex].date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
                                    label: (item) => {
                                        const day = days[item.dataIndex];
                                        return day.score === null ? 'No hours logged' : `${day.score}% score · ${day.logged}/24h logged`;
                                    }
                                }
                            }
                        },
                        animation: { duration: 300 }
                    }
                });
                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [days, theme]);

            if (!hasData) {
                return (
                    <div className="h-full w-full flex items-center justify-center">
                        <div className="text-center">
                            <div className="body-text text-[var(--text-secondary)]">No trend yet</div>
                            <div className="micro-label mt-1">Log an hour to start the chart.</div>
                        </div>
                    </div>
                );
            }

            return <canvas ref={chartRef} className="w-full h-full" />;
        });

        // --- Storage ---
        const LOG_SCHEMA_VERSION = 2;
        let storageWarning = null;

        const loadLogs = () => {
            const raw = localStorage.getItem('karm_data');
            if (!raw) return {};
            let parsed;
            try {
                parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('Not an object');
            } catch (e) {
                const backupKey = `karm_data_backup_${Date.now()}`;
                try { localStorage.setItem(backupKey, raw); } catch (err) {}
                storageWarning = 'Saved data could not be read. The original was backed up in this browser.';
                return {};
            }

            let migrated = false;
            const version = parseInt(localStorage.getItem('karm_schema_version') || '0', 10);
            if (version < LOG_SCHEMA_VERSION) {
                Object.keys(parsed).forEach(k => {
                    // Legacy "fitness" became Gym. Neutral is a real category and is never rewritten.
                    if (parsed[k] && parsed[k].category === 'fitness') {
                        parsed[k].category = 'gym';
                        migrated = true;
                    }
                });
                localStorage.setItem('karm_schema_version', String(LOG_SCHEMA_VERSION));
            }
            if (migrated) localStorage.setItem('karm_data', JSON.stringify(parsed));
            return parsed;
        };

        const previousHourSlot = (from = new Date()) => {
            const date = new Date(from);
            let hour = date.getHours() - 1;
            if (hour < 0) {
                hour = 23;
                date.setDate(date.getDate() - 1);
            }
            return { date, hour };
        };

        const hourRangeLabel = (h) => {
            const start = h % 12 || 12;
            const endH = (h + 1) % 24;
            const end = endH % 12 || 12;
            const startAmPm = h >= 12 ? 'PM' : 'AM';
            const endAmPm = endH >= 12 ? 'PM' : 'AM';
            return startAmPm === endAmPm
                ? `${start}–${end} ${startAmPm}`
                : `${start} ${startAmPm}–${end} ${endAmPm}`;
        };

        const hourShortLabel = (h) => h === 0 ? '12a' : h < 12 ? `${h}a` : h === 12 ? '12p' : `${h - 12}p`;

        const shortDate = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        // --- Modal shell: dialog semantics, focus trap, Escape, backdrop click ---
        const Modal = ({ children, onClose, labelledBy, maxWidth = 'max-w-lg', onKeyDown }) => {
            const cardRef = useRef(null);
            const closeRef = useRef(onClose);
            closeRef.current = onClose;

            useEffect(() => {
                const previous = document.activeElement;
                const card = cardRef.current;
                const focusables = () => Array.from(card.querySelectorAll(
                    'button:not([disabled]), [href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])'
                )).filter(el => el.offsetParent !== null);
                const first = card.querySelector('[data-autofocus]') || focusables()[0];
                if (first) first.focus();
                const onKey = (e) => {
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        closeRef.current();
                        return;
                    }
                    if (e.key !== 'Tab') return;
                    const list = focusables();
                    if (list.length === 0) return;
                    const firstEl = list[0];
                    const lastEl = list[list.length - 1];
                    if (e.shiftKey && document.activeElement === firstEl) {
                        e.preventDefault();
                        lastEl.focus();
                    } else if (!e.shiftKey && document.activeElement === lastEl) {
                        e.preventDefault();
                        firstEl.focus();
                    }
                };
                document.addEventListener('keydown', onKey);
                const previousOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => {
                    document.removeEventListener('keydown', onKey);
                    document.body.style.overflow = previousOverflow;
                    if (previous && typeof previous.focus === 'function') previous.focus();
                };
            }, []);

            return (
                <div
                    className="fixed inset-0 z-[100] bg-[var(--overlay)] backdrop-blur-sm flex items-center justify-center p-4 modal-fade-in"
                    onMouseDown={(e) => { if (e.target === e.currentTarget) closeRef.current(); }}
                >
                    <div
                        ref={cardRef}
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby={labelledBy}
                        onKeyDown={onKeyDown}
                        className={`bg-[var(--bg-secondary)] border border-[var(--border)] rounded-2xl w-full ${maxWidth} max-h-[90vh] overflow-y-auto p-6`}
                    >
                        {children}
                    </div>
                </div>
            );
        };

        function App() {
            const [logs, setLogs] = useState(loadLogs);

            const [goals, setGoals] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('karm_goals')) || { productive: 8, sleep: 7 };
                } catch(e) {
                    return { productive: 8, sleep: 7 };
                }
            });

            const [viewDate, setViewDate] = useState(new Date());
            const [calendarMonth, setCalendarMonth] = useState(() => {
                const d = new Date();
                return new Date(d.getFullYear(), d.getMonth(), 1);
            });
            const [timerOn, setTimerOn] = useState(() => localStorage.getItem('karm_timer') === 'true');
            const [soundEnabled, setSoundEnabled] = useState(() => localStorage.getItem('karm_sound') === 'true');
            const [theme, setTheme] = useState(() => {
                const saved = localStorage.getItem('karm_theme');
                return saved === 'light' || saved === 'dark' ? saved : 'dark';
            });
            const [analyticsOpen, setAnalyticsOpen] = useState(false);
            const [activeTab, setActiveTab] = useState('trends');
            const [modals, setModals] = useState({ log: false, sleep: false, goals: false });
            const [selectedLogHour, setSelectedLogHour] = useState(null);
            
            const [toast, setToast] = useState({ show: false, message: '', type: 'success', action: null });
            const [countdown, setCountdown] = useState('');
            const lastPromptHourRef = useRef(-1);
            const toastTimerRef = useRef(null);
            
            const audioCtxRef = useRef(null);
            const alarmOscillatorRef = useRef(null);

            const [logText, setLogText] = useState('');
            const [logCategory, setLogCategory] = useState(null);
            const [sleepSelection, setSleepSelection] = useState([]);
            const [tempGoals, setTempGoals] = useState({ productive: 8, sleep: 7 });

            useEffect(() => localStorage.setItem('karm_data', JSON.stringify(logs)), [logs]);
            useEffect(() => localStorage.setItem('karm_goals', JSON.stringify(goals)), [goals]);
            useEffect(() => localStorage.setItem('karm_timer', timerOn), [timerOn]);
            useEffect(() => localStorage.setItem('karm_sound', soundEnabled), [soundEnabled]);
            useEffect(() => {
                document.documentElement.dataset.theme = theme;
                localStorage.setItem('karm_theme', theme);
            }, [theme]);


            useEffect(() => {
                if (getDateKey(viewDate) !== getDateKey(new Date())) return;
                const t = setTimeout(() => {
                    const scroller = document.getElementById('hour-grid-scroll');
                    const el = document.getElementById(`hour-${new Date().getHours()}`);
                    if (!scroller || !el) return;
                    // Scroll only the hour grid. scrollIntoView also moved the app shell,
                    // which clipped the header at the top of the viewport.
                    const sr = scroller.getBoundingClientRect();
                    const er = el.getBoundingClientRect();
                    const delta = (er.top - sr.top) - (scroller.clientHeight - er.height) / 2;
                    scroller.scrollTo({ top: Math.max(0, scroller.scrollTop + delta), behavior: 'smooth' });
                }, 100);
                return () => clearTimeout(t);
            }, [viewDate]);

            const showToast = useCallback((message, type = 'success', action = null) => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast({ show: true, message, type, action });
                toastTimerRef.current = setTimeout(() => {
                    setToast(prev => ({ ...prev, show: false, action: null }));
                }, action ? 6000 : 3200);
            }, []);

            useEffect(() => {
                if (storageWarning) {
                    const message = storageWarning;
                    storageWarning = null;
                    showToast(message, 'error');
                }
            }, [showToast]);

            useEffect(() => () => { if (toastTimerRef.current) clearTimeout(toastTimerRef.current); }, []);

            const stopAlarm = useCallback(() => {
                if (alarmOscillatorRef.current) {
                    try { alarmOscillatorRef.current.stop(); } catch(e) {}
                    try { alarmOscillatorRef.current.disconnect(); } catch(e) {}
                    alarmOscillatorRef.current = null;
                }
                if (audioCtxRef.current) {
                    try { audioCtxRef.current.close(); } catch(e) {}
                    audioCtxRef.current = null;
                }
            }, []);

            const startAlarm = useCallback(() => {
                if (!soundEnabled) return;
                stopAlarm();
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                audioCtxRef.current = ctx;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                const now = ctx.currentTime;
                for (let i = 0; i < 120; i++) {
                    gain.gain.setValueAtTime(0.1, now + i * 0.5);
                    gain.gain.setValueAtTime(0, now + i * 0.5 + 0.25);
                }
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                alarmOscillatorRef.current = osc;
            }, [soundEnabled, stopAlarm]);

            useEffect(() => {
                if (!timerOn) {
                    setCountdown('');
                    stopAlarm();
                    return;
                }
                const tick = () => {
                    const now = new Date();
                    const min = now.getMinutes();
                    const sec = now.getSeconds();
                    const currentHour = now.getHours();
                    const totalSec = 3600 - (min * 60 + sec);
                    const m = Math.floor(totalSec / 60);
                    const s = totalSec % 60;
                    setCountdown(`Next log in ${m}:${s.toString().padStart(2, '0')}`);
                    if (min === 0 && lastPromptHourRef.current !== currentHour) {
                        const prevHour = currentHour === 0 ? 23 : currentHour - 1;
                        const prevDate = new Date(now);
                        if (currentHour === 0) prevDate.setDate(prevDate.getDate() - 1);
                        const dateKey = getDateKey(prevDate);
                        const logKey = `${dateKey}_${prevHour}`;
                        if (!logs[logKey]) {
                            lastPromptHourRef.current = currentHour;
                            setViewDate(prevDate);
                            setSelectedLogHour({ date: prevDate, hour: prevHour });
                            setLogText('');
                            setLogCategory(null);
                            setModals(m => ({ ...m, log: true }));
                            startAlarm();
                        }
                    }
                };
                tick();
                const interval = setInterval(tick, 1000);
                return () => clearInterval(interval);
            }, [timerOn, logs, startAlarm, stopAlarm]);

            const viewDateStats = useMemo(() => {
                const s = getDayStats(viewDate, logs);
                const counts = {};
                Object.keys(s).forEach(k => counts[k] = s[k]);
                return counts;
            }, [viewDate, logs]);

            const loggedHours = 24 - viewDateStats.unlogged;
            const productiveHours = viewDateStats.productive + viewDateStats.gym;
            
            const openLogModal = useCallback((date, hour) => {
                const key = `${getDateKey(date)}_${hour}`;
                const existing = logs[key];
                setSelectedLogHour({ date, hour });
                setLogText(existing ? existing.text : '');
                setLogCategory(existing ? existing.category : null);
                setModals(m => ({ ...m, log: true }));
            }, [logs]);

            const handleLogSave = () => {
                if (!selectedLogHour || !logCategory) return;
                const key = `${getDateKey(new Date(selectedLogHour.date))}_${selectedLogHour.hour}`;
                const isEdit = Boolean(logs[key]);
                setLogs(prev => ({
                    ...prev,
                    [key]: { text: logText.trim(), category: logCategory, timestamp: new Date().toISOString() }
                }));
                stopAlarm();
                setModals(m => ({ ...m, log: false }));
                showToast(isEdit ? 'Activity updated' : 'Activity logged');
            };

            const toggleSleepHour = (h) => {
                setSleepSelection(prev => prev.includes(h) ? prev.filter(item => item !== h) : [...prev, h]);
            };

            const saveSleep = () => {
                if (sleepSelection.length === 0) return;
                const dateKey = getDateKey(viewDate);
                const newLogs = { ...logs };
                let logged = 0;
                let kept = 0;
                sleepSelection.forEach(h => {
                    const key = `${dateKey}_${h}`;
                    const existing = logs[key];
                    if (existing && existing.category !== 'sleep') {
                        kept++;
                        return;
                    }
                    newLogs[key] = { text: 'Sleep', category: 'sleep', timestamp: new Date().toISOString() };
                    logged++;
                });
                setLogs(newLogs);
                setModals(m => ({ ...m, sleep: false }));
                setSleepSelection([]);
                if (logged > 0) {
                    showToast(kept > 0
                        ? `Logged ${logged}h of sleep. ${kept} existing ${kept === 1 ? 'log was' : 'logs were'} left unchanged.`
                        : `Logged ${logged}h of sleep`);
                } else {
                    showToast('Those hours are already logged. Nothing changed.', 'error');
                }
            };

            const saveGoals = () => {
                const clamp = (v) => Math.max(1, Math.min(24, Number.isFinite(v) ? v : 1));
                setGoals({ productive: clamp(tempGoals.productive), sleep: clamp(tempGoals.sleep) });
                setModals(m => ({ ...m, goals: false }));
                showToast('Goals updated');
            };

            const copyYesterday = () => {
                const target = new Date(getDateKey(viewDate).split('-')[0], Number(getDateKey(viewDate).split('-')[1]) - 1, Number(getDateKey(viewDate).split('-')[2]));
                const source = new Date(target);
                source.setDate(source.getDate() - 1);
                const yKey = getDateKey(source);
                const tKey = getDateKey(target);
                const newLogs = { ...logs };
                let copiedCount = 0;
                for (let h = 0; h < 24; h++) {
                    const srcKey = `${yKey}_${h}`;
                    const destKey = `${tKey}_${h}`;
                    if (newLogs[srcKey] && !newLogs[destKey]) {
                        newLogs[destKey] = { ...newLogs[srcKey], timestamp: new Date().toISOString() };
                        copiedCount++;
                    }
                }
                if (copiedCount > 0) {
                    setLogs(newLogs);
                    showToast(`Copied ${copiedCount} ${copiedCount === 1 ? 'log' : 'logs'} into ${isToday ? 'today' : 'this day'}.`);
                } else {
                    showToast(`Nothing to copy, or this day is already full.`, 'error');
                }
            };

            const deleteLog = () => {
                if (!selectedLogHour) return;
                const key = `${getDateKey(new Date(selectedLogHour.date))}_${selectedLogHour.hour}`;
                const removed = logs[key];
                setLogs(prev => {
                    const next = { ...prev };
                    delete next[key];
                    return next;
                });
                stopAlarm();
                setModals(m => ({ ...m, log: false }));
                showToast('Activity deleted', 'error', {
                    label: 'Undo',
                    onClick: () => {
                        setLogs(prev => ({ ...prev, [key]: removed }));
                        showToast('Activity restored');
                    }
                });
            };

            const prodProgress = Math.min((productiveHours / (goals.productive || 1)) * 100, 100);
            const sleepProgress = Math.min((viewDateStats.sleep / (goals.sleep || 1)) * 100, 100);
            const isToday = getDateKey(viewDate) === getDateKey(new Date());
            const currentHour = new Date().getHours();

            const weekData = useMemo(() => {
                const counts = {};
                for (let i = 0; i < 7; i++) {
                    const d = new Date(); d.setDate(d.getDate() - i);
                    const s = getDayStats(d, logs);
                    Object.keys(s).forEach(k => counts[k] = (counts[k] || 0) + s[k]);
                }
                return counts;
            }, [logs]);

            const allTimeBest = useMemo(() => {
                let best = null;
                const uniqueDates = new Set();
                Object.keys(logs).forEach(key => uniqueDates.add(key.split('_')[0]));
                uniqueDates.forEach(dateStr => {
                    const parts = dateStr.split('-').map(Number);
                    if (parts.length !== 3) return;
                    const stats = getDayStats(new Date(parts[0], parts[1] - 1, parts[2]), logs);
                    const active = 24 - stats.unlogged - stats.sleep;
                    if (active <= 0) return;
                    const score = getProductivityScore(stats);
                    if (!best || score > best.score) {
                        best = { score, logged: 24 - stats.unlogged, active, date: new Date(parts[0], parts[1] - 1, parts[2]) };
                    }
                });
                return best;
            }, [logs]);

            const vsLastWeek = useMemo(() => {
                const averageWindow = (offset) => {
                    let sum = 0;
                    let days = 0;
                    for (let i = offset; i < offset + 7; i++) {
                        const d = new Date(); d.setDate(d.getDate() - i);
                        const stats = getDayStats(d, logs);
                        if (24 - stats.unlogged - stats.sleep > 0) {
                            sum += getProductivityScore(stats);
                            days++;
                        }
                    }
                    return { avg: days > 0 ? sum / days : null, days };
                };
                const recent = averageWindow(1);
                const prior = averageWindow(8);
                if (recent.days < 3 || prior.days < 3 || !prior.avg) {
                    return { available: false, val: 0, trend: 'flat' };
                }
                const diff = ((recent.avg - prior.avg) / prior.avg) * 100;
                return {
                    available: true,
                    val: Math.abs(Math.round(diff)),
                    trend: diff >= 0.5 ? 'up' : diff <= -0.5 ? 'down' : 'flat'
                };
            }, [logs]);

            const streak = useMemo(() => calculateStreak(logs), [logs]);
            const activeLogged = 24 - viewDateStats.unlogged - viewDateStats.sleep;
            const viewScore = activeLogged > 0 ? getProductivityScore(viewDateStats) : null;

            const totalCapacity = activeTab === 'categories' ? 168 : 24;
            const currentData = activeTab === 'categories' ? weekData : viewDateStats;
            const coveredHours = totalCapacity - (currentData['unlogged'] || 0);

            const goToday = () => {
                const now = new Date();
                setViewDate(now);
                setCalendarMonth(new Date(now.getFullYear(), now.getMonth(), 1));
            };

            const loggableCategories = Object.entries(CATEGORIES).filter(([key]) => key !== 'unlogged');
            const selectedExistingLog = selectedLogHour
                ? logs[`${getDateKey(new Date(selectedLogHour.date))}_${selectedLogHour.hour}`]
                : null;
            const sleepConflicts = sleepSelection.filter(h => {
                const existing = logs[`${getDateKey(viewDate)}_${h}`];
                return existing && existing.category !== 'sleep';
            }).length;

            const nowMonth = new Date();
            const calendarIsCurrent = calendarMonth.getFullYear() === nowMonth.getFullYear() && calendarMonth.getMonth() === nowMonth.getMonth();
            const todayDisabled = isToday && calendarIsCurrent;

            return (
                <div className="h-screen w-screen flex flex-col overflow-clip bg-[var(--bg-primary)] font-sans text-[var(--text-primary)]">
                    {toast.show && (
                        <div role="status" aria-live="polite" className="fixed top-5 left-1/2 -translate-x-1/2 z-[150] max-w-[calc(100vw-2rem)] bg-[var(--bg-secondary)] border border-[var(--border-strong)] text-[var(--text-primary)] pl-4 pr-3 py-2.5 rounded-xl shadow-[0_12px_32px_var(--shadow-color)] toast-slide-up flex items-center gap-3">
                            <span className="shrink-0">
                                {toast.type === 'success' ? <Activity size={16} className="text-[var(--productive)]"/> : <XCircle size={16} className="text-[var(--wasted)]"/>}
                            </span>
                            <span className="text-sm font-medium leading-snug">{toast.message}</span>
                            {toast.action && (
                                <button
                                    type="button"
                                    onClick={() => {
                                        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                                        toast.action.onClick();
                                    }}
                                    className="shrink-0 rounded-lg bg-[var(--bg-tertiary)] hover:bg-[var(--bg-hover)] px-2.5 py-1.5 text-sm font-semibold text-[var(--text-primary)] transition-colors"
                                >
                                    {toast.action.label}
                                </button>
                            )}
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-[var(--bg-primary)] border-b border-[var(--border)] px-4 sm:px-6 lg:px-8 py-3 grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-3 shrink-0">
                        <div className="flex items-center gap-2.5 min-w-0">
                            <div className="bg-[var(--accent)] p-1.5 rounded-lg"><Clock size={18} className="text-white" aria-hidden="true"/></div>
                            <h1 className="text-lg font-semibold tracking-tight">KARM</h1>
                        </div>
                        
                        <div className="justify-self-center">
                            <DigitalClock />
                        </div>

                        <div className="flex items-center gap-2 justify-self-end">
                            <button
                                type="button"
                                onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}
                                aria-label={`Switch to ${theme === 'light' ? 'dark' : 'light'} theme`}
                                title={`Switch to ${theme === 'light' ? 'dark' : 'light'} theme`}
                                className="btn-quiet p-2 rounded-lg text-[var(--text-secondary)]"
                            >
                                {theme === 'light'
                                    ? <Moon size={18} aria-hidden="true"/>
                                    : <Sun size={18} aria-hidden="true"/>}
                            </button>
                            <button
                                type="button"
                                onClick={copyYesterday}
                                aria-label={isToday ? 'Copy yesterday' : 'Copy previous day'}
                                title={isToday ? 'Copy yesterday' : 'Copy previous day'}
                                className="btn-quiet p-2 rounded-lg text-[var(--text-secondary)] hidden sm:flex"
                            >
                                <Copy size={17} aria-hidden="true"/>
                            </button>
                            <button
                                type="button"
                                onClick={() => setModals(prev => ({ ...prev, sleep: true }))}
                                aria-label="Log sleep"
                                className="btn-primary text-sm px-3 sm:px-4 py-2 flex items-center gap-2 whitespace-nowrap"
                            >
                                <Moon size={15} aria-hidden="true"/>
                                <span className="sm:hidden">Sleep</span>
                                <span className="hidden sm:inline">Log Sleep</span>
                            </button>
                            <button 
                                type="button"
                                onClick={goToday}
                                disabled={todayDisabled}
                                className="btn-quiet px-3 sm:px-4 py-2 text-sm font-medium whitespace-nowrap disabled:text-[var(--text-tertiary)] disabled:opacity-60"
                            >
                                Today
                            </button>
                            <button
                                type="button"
                                onClick={() => setAnalyticsOpen(open => !open)}
                                aria-expanded={analyticsOpen}
                                aria-controls="analytics-panel"
                                aria-label={analyticsOpen ? 'Hide analytics' : 'Show analytics'}
                                className="btn-quiet px-3 py-2 text-sm font-medium flex items-center gap-2 whitespace-nowrap"
                            >
                                <BarChart size={15} aria-hidden="true"/>
                                <span className="hidden xl:inline">{analyticsOpen ? 'Hide Analytics' : 'Show Analytics'}</span>
                            </button>
                        </div>
                    </header>

                    {/* Content */}
                    <div className="flex flex-1 min-h-0 flex-col lg:flex-row overflow-y-auto lg:overflow-hidden">
                        {/* Sidebar */}
                        <aside id="app-sidebar" className="order-2 lg:order-1 w-full lg:w-[320px] shrink-0 lg:h-full overflow-visible lg:overflow-y-auto p-4 flex flex-col gap-4 border-t lg:border-t-0 lg:border-r border-[var(--border)] bg-[var(--bg-primary)]">
                            {/* Quick Actions removed: Log Sleep lives in the header; the grid still opens any hour. */}

                            <MiniCalendar 
                                logs={logs} 
                                selectedDate={viewDate}
                                month={calendarMonth}
                                onSelectDate={(date) => {
                                    setViewDate(date);
                                    setCalendarMonth(new Date(date.getFullYear(), date.getMonth(), 1));
                                }}
                                onPrevMonth={() => setCalendarMonth(m => new Date(m.getFullYear(), m.getMonth() - 1, 1))}
                                onNextMonth={() => setCalendarMonth(m => new Date(m.getFullYear(), m.getMonth() + 1, 1))}
                            />

                            {/* Goals */}
                            <div className="widget-card">
                                <div className="flex items-center justify-between gap-2 mb-4">
                                    <h4 className="subsection flex items-baseline gap-2">
                                        <Target className="text-[var(--accent)] self-center" size={18} aria-hidden="true" /> Daily Goals
                                        <span className="micro-label font-normal">{isToday ? 'Today' : shortDate(viewDate)}</span>
                                    </h4>
                                    <button
                                        type="button"
                                        onClick={() => { setTempGoals(goals); setModals(prev => ({ ...prev, goals: true })); }}
                                        className="btn-quiet px-3 py-1.5 text-xs font-medium rounded-lg"
                                    >
                                        Edit
                                    </button>
                                </div>
                                <div className="goals-list space-y-4">
                                    <div>
                                        <div className="flex justify-between body-text mb-2">
                                            <span>Productive time</span>
                                            <span className="font-mono mono-nums font-semibold">{productiveHours}h / {goals.productive}h</span>
                                        </div>
                                        <div
                                            role="progressbar"
                                            aria-label="Productive time goal"
                                            aria-valuemin="0"
                                            aria-valuemax={goals.productive}
                                            aria-valuenow={Math.min(productiveHours, goals.productive)}
                                            className="w-full bg-[var(--bg-tertiary)] h-2 rounded-full overflow-hidden"
                                        >
                                            <div className="bg-[var(--productive)] h-2 rounded-full transition-all duration-500" style={{ width: `${prodProgress}%` }}></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between body-text mb-2">
                                            <span>Sleep</span>
                                            <span className="font-mono mono-nums font-semibold">{viewDateStats.sleep}h / {goals.sleep}h</span>
                                        </div>
                                        <div
                                            role="progressbar"
                                            aria-label="Sleep goal"
                                            aria-valuemin="0"
                                            aria-valuemax={goals.sleep}
                                            aria-valuenow={Math.min(viewDateStats.sleep, goals.sleep)}
                                            className="w-full bg-[var(--bg-tertiary)] h-2 rounded-full overflow-hidden"
                                        >
                                            <div className="bg-[var(--sleep)] h-2 rounded-full transition-all duration-500" style={{ width: `${sleepProgress}%` }}></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Focus Timer */}
                            <div className="widget-card">
                                <div className="flex justify-between items-center mb-3">
                                    <h4 className="subsection flex items-center gap-2">
                                        <span className={timerOn ? 'text-[var(--accent)]' : 'text-[var(--text-secondary)]'}><Clock size={18} aria-hidden="true"/></span>
                                        Focus Timer
                                    </h4>
                                    <button 
                                        type="button"
                                        onClick={() => setSoundEnabled(!soundEnabled)}
                                        aria-label={soundEnabled ? 'Mute timer alarm' : 'Enable timer alarm'}
                                        aria-pressed={soundEnabled}
                                        className={`btn-quiet p-2 rounded-lg ${soundEnabled ? 'bg-[var(--accent)] text-white hover:bg-[var(--accent-hover)]' : 'text-[var(--text-secondary)]'}`}
                                    >
                                        {soundEnabled ? <Volume2 size={14} aria-hidden="true"/> : <VolumeX size={14} aria-hidden="true"/>}
                                    </button>
                                </div>
                                <div className="timer-block text-center flex flex-col items-center justify-center gap-1.5 mb-4 pt-1">
                                    <div className={`timer-readout font-mono mono-nums text-[32px] leading-none font-semibold tracking-tight ${timerOn ? 'text-[var(--accent)]' : 'text-[var(--text-tertiary)]'}`}>
                                        {timerOn ? countdown.replace('Next log in ', '') : '00:00'}
                                    </div>
                                    <div className="micro-label">{timerOn ? 'until the next hourly prompt' : 'Timer is off'}</div>
                                </div>
                                <button
                                    type="button"
                                    onClick={() => setTimerOn(!timerOn)}
                                    aria-pressed={timerOn}
                                    className="timer-button btn-quiet w-full flex items-center justify-center gap-2 py-2.5 text-sm font-medium"
                                >
                                    {timerOn ? 'Stop Timer' : 'Start Timer'}
                                </button>
                                <p className="timer-hint micro-label mt-2.5 text-center">Prompts you at the top of each hour.</p>
                            </div>
                        </aside>

                        {/* Main Grid View */}
                        <main className="order-1 lg:order-2 flex-1 min-w-0 flex flex-col lg:h-full lg:overflow-hidden bg-[var(--bg-primary)]">
                            <div className="grid grid-cols-[minmax(0,1fr)_auto] gap-x-4 gap-y-2 sm:flex sm:items-start sm:justify-between px-4 sm:px-6 pt-6 pb-5">
                                <div className="col-span-2 min-w-0 sm:col-span-1">
                                    <h2 className="text-2xl sm:text-3xl font-semibold tracking-tight leading-tight">
                                        {viewDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}
                                    </h2>
                                    <p className="small-label mt-1.5">
                                        <span className="font-mono mono-nums font-semibold text-[var(--text-primary)]">{loggedHours}/24</span> hours logged
                                        {streak > 0 && <> · <span title="Consecutive days with at least 5 hours logged">{streak}-day streak</span></>}
                                    </p>
                                </div>
                                <div className="col-span-2 flex flex-col items-start gap-0.5 sm:col-span-1 sm:block sm:shrink-0 sm:text-right">
                                    <div className="flex items-baseline gap-2 sm:justify-end">
                                        <span className={`hero-number ${viewScore === null ? 'text-[var(--text-tertiary)]' : 'text-[var(--text-primary)]'}`}>
                                            {viewScore === null ? '—' : `${viewScore}%`}
                                        </span>
                                        <span className="small-label">{viewScore === null ? 'no score' : isToday ? 'today' : 'score'}</span>
                                    </div>
                                    <div className="micro-label mt-1 max-w-[280px] text-left sm:text-right">
                                        {viewScore === null ? (
                                            'No active hours logged'
                                        ) : (
                                            <>
                                                <span className="block">Productive + Gym + ½ Semi + ½ Neutral</span>
                                                <span className="block">Sleep excluded</span>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div id="hour-grid-scroll" className="flex-1 min-h-0 lg:overflow-y-auto px-4 sm:px-6 pt-2 pb-8">
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-6 gap-2.5 sm:gap-3 auto-rows-[104px]">
                                    {Array.from({length: 24}).map((_, h) => {
                                        const key = `${getDateKey(viewDate)}_${h}`;
                                        const log = logs[key];
                                        const cat = (log && CATEGORIES[log.category]) ? CATEGORIES[log.category] : CATEGORIES.unlogged;
                                        const IconComponent = cat.icon;
                                        const timeLabel = hourRangeLabel(h);
                                        const isCurrentHour = isToday && h === currentHour;

                                        return (
                                            <button 
                                                type="button"
                                                key={h} 
                                                id={`hour-${h}`}
                                                onClick={() => openLogModal(viewDate, h)}
                                                data-logged={log ? 'true' : 'false'}
                                                aria-label={`Log ${timeLabel}${log ? `, logged as ${cat.label}${log.text ? `. Note: ${log.text}` : ''}` : ', unlogged'}`}
                                                title={log && log.text ? log.text : undefined}
                                                style={log ? { backgroundColor: cat.color, color: cat.ink } : undefined}
                                                className={`timeline-block group relative text-left h-full rounded-2xl p-3 overflow-hidden flex flex-col justify-between
                                                    ${log ? 'border border-transparent' : 'border border-dashed border-[var(--border-strong)] hover:border-[var(--text-tertiary)]'}
                                                    ${isCurrentHour ? 'ring-2 ring-[var(--accent)] ring-offset-2 ring-offset-[var(--bg-primary)]' : ''}`}
                                            >
                                                <span className="flex items-start justify-between gap-2 w-full">
                                                    <span className={`font-mono mono-nums text-[15px] font-semibold uppercase tracking-wide ${log ? 'opacity-80' : 'text-[var(--text-tertiary)]'}`}>
                                                        {timeLabel}
                                                    </span>
                                                    {isCurrentHour ? (
                                                        <span className="relative flex h-2.5 w-2.5 mt-0.5" aria-hidden="true">
                                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-current opacity-60"></span>
                                                            <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-current"></span>
                                                        </span>
                                                    ) : null}
                                                </span>

                                                <span className="w-full mt-2">
                                                    {log ? (
                                                        <>
                                                            <span className="flex items-center gap-2 text-[17px] font-semibold leading-tight">
                                                                <IconComponent size={17} aria-hidden="true"/>{cat.label}
                                                            </span>
                                                            {log.text && (
                                                                <span className="mt-1 block truncate text-[12px] leading-tight opacity-85">{log.text}</span>
                                                            )}
                                                        </>
                                                    ) : (
                                                        <span className="flex items-center gap-2 text-[15px] font-medium text-[var(--text-secondary)] group-hover:text-[var(--text-primary)] transition-colors">
                                                            <Plus size={16} aria-hidden="true"/>Log Activity
                                                        </span>
                                                    )}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Bottom Analytics Panel */}
                    <aside id="analytics-panel" aria-label="Analytics" className={`shrink-0 w-full bg-[var(--bg-secondary)] border-t border-[var(--border)] transition-[height] duration-300 flex flex-col max-h-[70vh] ${analyticsOpen ? 'h-[420px]' : 'h-12'}`}>
                        <div className="flex items-center justify-between gap-4 px-4 sm:px-6 lg:px-8 py-3 border-b border-[var(--border)] shrink-0">
                            <div className="flex gap-5 sm:gap-8 overflow-x-auto">
                                {['Trends', 'Categories', 'Daily View'].map(tab => {
                                    const isActive = activeTab === tab.toLowerCase() && analyticsOpen;
                                    return (
                                        <button 
                                            type="button"
                                            key={tab}
                                            onClick={() => { setActiveTab(tab.toLowerCase()); setAnalyticsOpen(true); }}
                                            aria-pressed={isActive}
                                            className={`text-[15px] font-medium pb-1 -mb-px border-b-2 whitespace-nowrap transition-colors ${isActive ? 'text-[var(--text-primary)] border-[var(--accent)]' : 'text-[var(--text-secondary)] border-transparent hover:text-[var(--text-primary)]'}`}
                                        >
                                            {tab}
                                        </button>
                                    );
                                })}
                            </div>
                            <button
                                type="button"
                                onClick={() => setAnalyticsOpen(open => !open)}
                                aria-expanded={analyticsOpen}
                                aria-controls="analytics-panel"
                                aria-label={analyticsOpen ? 'Collapse analytics' : 'Expand analytics'}
                                className="btn-quiet px-3 py-2 rounded-lg text-[var(--text-secondary)] shrink-0 flex items-center gap-2"
                            >
                                {analyticsOpen ? <ChevronDown size={18} aria-hidden="true"/> : <ChevronUp size={18} aria-hidden="true"/>}
                                <span className="text-sm font-medium">{analyticsOpen ? 'Collapse' : 'Expand'}</span>
                            </button>
                        </div>

                        {analyticsOpen && (
                            <div className="flex-1 p-4 sm:p-6 overflow-y-auto bg-[var(--bg-primary)]">
                                {activeTab === 'trends' && (
                                    <div className="h-full flex flex-col lg:flex-row gap-4 lg:gap-6">
                                        <div className="flex-1 min-h-[180px] flex flex-col">
